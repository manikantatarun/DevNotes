<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devnotes</title>
    <script>
      // Ensure relative asset URLs resolve from app root even on deep links.
      (function (l, d) {
        var isProjectPath = l.pathname.toLowerCase().indexOf('/devnotes/') === 0;
        var baseHref = isProjectPath ? '/DevNotes/' : '/';
        d.write('<base href="' + baseHref + '">');
      })(window.location, document);
    </script>
    <script>
      // Decode GitHub Pages SPA fallback query back into the original path.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
