<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevNotes</title>
    <script>
      // GitHub Pages SPA fallback: encode current path into query and send to app entry.
      (function (l) {
        var isProjectPath = l.pathname.toLowerCase().indexOf('/devnotes/') === 0;
        var basePath = isProjectPath ? '/DevNotes' : '';
        var preservedPath = l.pathname.slice(basePath.length + 1).replace(/&/g, '~and~');
        var preservedSearch = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            basePath +
            '/?/' +
            preservedPath +
            preservedSearch +
            l.hash,
        );
      })(window.location);
    </script>
  </head>
  <body>
  </body>
</html>
